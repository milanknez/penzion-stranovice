<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="250" fill="url(#bgGrad)"/>
  
  <!-- Browser Window Frame -->
  <rect x="18" y="16" width="364" height="218" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Browser Top Bar -->
  <rect x="18" y="16" width="364" height="34" rx="10" fill="#0f172a"/>
  <!-- Window Controls -->
  <circle cx="36" cy="33" r="4.5" fill="#ef4444"/>
  <circle cx="50" cy="33" r="4.5" fill="#f59e0b"/>
  <circle cx="64" cy="33" r="4.5" fill="#10b981"/>
  
  <!-- URL Bar Mockup -->
  <rect x="85" y="25" width="170" height="16" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="95" y="30" width="80" height="6" rx="3" fill="#64748b"/>

  <!-- Admin CTA Button in Header -->
  <rect x="290" y="24" width="76" height="18" rx="6" fill="url(#accentGrad)"/>
  <text x="328" y="36.5" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">Admin CMS</text>

  <!-- Hero / Banner Area -->
  <rect x="34" y="62" width="332" height="88" rx="8" fill="#182234" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="200" cy="85" r="14" fill="#6366f1" fill-opacity="0.15"/>
  <!-- Sparkle / Cube icon in Hero -->
  <polygon points="200,76 210,81 210,91 200,96 190,91 190,81" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  
  <text x="200" y="112" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" letter-spacing="0.5">Default Theme</text>
  <text x="200" y="130" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Standardní čisté téma Fida CMS</text>

  <!-- Cards Row -->
  <rect x="34" y="160" width="102" height="54" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="46" y="172" width="50" height="6" rx="3" fill="#60a5fa"/>
  <rect x="46" y="184" width="78" height="5" rx="2.5" fill="#475569"/>
  <rect x="46" y="193" width="60" height="5" rx="2.5" fill="#334155"/>

  <rect x="149" y="160" width="102" height="54" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="161" y="172" width="50" height="6" rx="3" fill="#a78bfa"/>
  <rect x="161" y="184" width="78" height="5" rx="2.5" fill="#475569"/>
  <rect x="161" y="193" width="60" height="5" rx="2.5" fill="#334155"/>

  <rect x="264" y="160" width="102" height="54" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="276" y="172" width="50" height="6" rx="3" fill="#34d399"/>
  <rect x="276" y="184" width="78" height="5" rx="2.5" fill="#475569"/>
  <rect x="276" y="193" width="60" height="5" rx="2.5" fill="#334155"/>
</svg>
